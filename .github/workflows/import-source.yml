name: Import SaddleMatch source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand application source
        run: |
          mkdir source
          unzip -oq saddlematch-v5-pricing.zip -d source
          rsync -a source/ ./ --exclude .git --exclude source --exclude saddlematch-v5-pricing.zip
          rm -rf source saddlematch-v5-pricing.zip
      - name: Commit application source
        run: |
          git config user.name "SaddleMatch"
          git config user.email "saddlematch@users.noreply.github.com"
          git add -A
          git commit -m "Publish SaddleMatch application source" || exit 0
          git push
